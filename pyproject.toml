[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-field-lab"
version = "0.2.0"
description = "A local maintainer workbench for claim-bounded reusable-agent evidence."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Faye & Cove"}]
dependencies = []

[project.urls]
Repository = "https://github.com/IndelibleVivi/skill-field-lab"
Issues = "https://github.com/IndelibleVivi/skill-field-lab/issues"

[project.scripts]
fieldlab = "fieldlab.cli:main"

[tool.setuptools.packages.find]
include = ["fieldlab*"]
