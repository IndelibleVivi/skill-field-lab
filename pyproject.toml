[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-field-lab"
version = "0.1.0"
description = "A quota-explicit field lab for evolving and evaluating reusable agent skills."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Faye & Cove"}]
dependencies = []

[project.urls]
Repository = "https://github.com/IndelibleVivi/skill-field-lab"
Issues = "https://github.com/IndelibleVivi/skill-field-lab/issues"

[project.scripts]
fieldlab = "fieldlab.cli:main"

[tool.setuptools.packages.find]
include = ["fieldlab*"]
